name: Job Watcher

on:
  schedule:
    # Runs every day at 07:00 UTC (~08:00/09:00 Amsterdam, depending on DST).
    # Adjust as you like — https://crontab.guru helps with the syntax.
    - cron: "30 10 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job watcher
        env:
          SHEETS_URL: ${{ secrets.SHEETS_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python job_watcher.py
