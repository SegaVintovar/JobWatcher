# Job Watcher configuration
#
# companies: list of targets. `token` is the company's slug on that ATS —
# find it in the careers page URL, e.g.:
#   boards.greenhouse.io/nebius          -> token: nebius
#   jobs.lever.co/some-company           -> token: some-company
#   jobs.ashbyhq.com/some-company        -> token: some-company
#   careers.smartrecruiters.com/Company  -> token: Company (case-sensitive!)
#   some-company.recruitee.com           -> token: some-company
#   apply.workable.com/some-company      -> token: some-company
#
# Workday is different — it needs three fields instead of one token.
# From a URL like https://priceline.wd1.myworkdayjobs.com/BookingHoldings:
#   tenant: priceline
#   wd_server: wd1
#   site: BookingHoldings
#
# Workday support is less stable than the others — it uses an internal
# (unofficial) endpoint and has bot protection. See job_watcher.py's
# fetch_workday() docstring for details.
#
# Not all tokens below are verified — confirm each one against the real
# careers URL before relying on it. A wrong token just means that company
# gets skipped with a warning, it won't break the whole run.

companies:
  - name: Nebius
    ats: greenhouse
    token: nebius          # confirmed — job-boards.greenhouse.io/nebius

  - name: Adyen
    ats: greenhouse
    token: adyen           # confirmed — job-boards.greenhouse.io/adyen

  - name: TomTom
    ats: lever
    token: tomtom          # confirmed — jobs.eu.lever.co/tomtom

  - name: Booking Holdings
    ats: workday
    tenant: priceline      # confirmed — priceline.wd1.myworkdayjobs.com/BookingHoldings
    wd_server: wd1
    site: BookingHoldings

  - name: Robin Radar
    ats: ashby
    token: robin-radar     # confirmed — their careers page links to jobs.ashbyhq.com/robin-radar

  # Add more companies here as you find them. Example for a Lever/Ashby company:
  # - name: Example Startup
  #   ats: ashby
  #   token: example-startup

# ---- Checked, but NOT watchable with this tool (check these by hand) ----
# The watcher only reads the ATS platforms listed at the top. These companies
# use something else, or their ATS couldn't be identified from the careers page:
#   Software Improvement Group  -> Personio (sig.jobs.personio.com) — not supported yet
#   Optiver                     -> custom careers site, no public API found
#   Picnic                      -> custom careers site (jobs.picnic.app)
#   Monumental                  -> custom careers page (monumental.co/jobs)
#   Hiber                       -> WordPress page, no vacancies listed when checked
#   Mploy Associates            -> Webflow page; consulting placements, not an ATS
#   Together AI                 -> careers page didn't reveal an ATS link
#   Databricks                  -> careers page loads jobs dynamically; ATS not confirmed

# Only roles whose title contains at least one of these (case-insensitive)
# will be added to the tracker. Keep this reasonably broad — you can always
# ignore/delete rows you don't care about in the sheet.
keywords:
  - "software engineer"
  - "backend"
  - "junior"
  - "graduate"
  - "intern"
  - "early talent"
  - "ai engineer"
  - "machine learning"
  - "llm"
  - "developer"
  - "student"
  - "werkstudent"
  - "working student"
  - "trainee"
  - "full-stack"
  - "fullstack"
  - "full stack"

# Roles whose title contains ANY of these (case-insensitive) are skipped,
# even if they also match a keyword above. Use this to filter out seniority
# levels or role types you don't want.
exclude_keywords:
  - "senior"
  - "staff"
  - "principal"
  - "lead"
  - "manager"
  - "director"
  - "head of"
  - "sales"           # keeps "Sales Developer" out
  - "business"        # keeps "Business Developer" out
  - "international"   # "intern" is a substring of these two
  - "internal"

# Only roles whose location text contains at least one of these
# (case-insensitive) are kept. Leave this list empty ([]) to disable
# location filtering entirely and keep every location.
#
# Caveat: if an ATS doesn't return a location for a posting (some don't),
# that posting gets excluded when this filter is on, since there's no way
# to confirm it's a match. This is rare but worth knowing about.
locations:
  - "netherlands"
  - "amsterdam"
  - "the hague"
  - "den haag"
  - "rotterdam"
  - "utrecht"
  - "eindhoven"
  - "delft"
  - "leiden"
  - "groningen"
  - "tilburg"
  - "nijmegen"
  - "breda"
  - "enschede"
  - "haarlem"
  - "arnhem"
  - "maastricht"
  - "zwolle"
  - "amersfoort"
  - "apeldoorn"
  - "hilversum"
  - "wageningen"
  - "almere"
  - "dordrecht"
  - "leeuwarden"
  - "zoetermeer"
  - "hoofddorp"
  - "schiphol"
  - "remote"  # catches NL companies (e.g. Robin Radar) that label roles "Remote"
              # instead of a city — trade-off: this also lets through remote
              # roles at non-NL companies, if any slip through the ATS list above
  # This is a city whitelist, not a geographic check — a role has to mention
  # one of these words to pass. If a real NL posting still gets filtered out,
  # check the "(... dropped by location filter ...)" diagnostic lines in the
  # run logs for the exact location text the ATS is using, and add it here.

# Adzuna discovery layer — finds jobs at companies NOT in your list above,
# by searching keywords + country directly (aggregates many companies).
# Needs a free API key: https://developer.adzuna.com — set ADZUNA_APP_ID
# and ADZUNA_APP_KEY as environment variables / repo secrets.
adzuna:
  enabled: true
  country: nl          # ISO country code Adzuna uses — nl = Netherlands
  results_per_page: 50 # max results per query, per run
  max_days_old: 3      # only postings from the last N days (keeps results fresh)
  queries:             # one search per line — each costs one API call
    - "junior software engineer"
    - "graduate software engineer"
    - "software engineer intern"
    - "ai engineer"
    - "backend developer"
